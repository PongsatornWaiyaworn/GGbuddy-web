services:
  - type: web
    name: ggbuddy-server
    env: go
    rootDir: BACKEND
    buildCommand: go build -o app
    startCommand: ./app
    autoDeploy: true
    plan: free

  - type: web
    name: ggbuddy
    env: node
    rootDir: GGbuddy
    buildCommand: npm install
    startCommand: npm run dev
    autoDeploy: true
    plan: free